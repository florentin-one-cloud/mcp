name: Publish to NPM

# Trigger on version tags (e.g., v1.0.0, v2.1.3)
on:
  push:
    tags:
      - 'v*.*.*'

# Configure permissions for the workflow
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      
      - name: Install dependencies
        run: bun install
      
      - name: Run tests
        run: bun test
      
      - name: Build all packages
        run: bun run build-all
      
      - name: Publish packages to NPM
        run: bun run publish-packages
        env:
          # NOTE: NPM_TOKEN must be configured in GitHub repository secrets
          # Go to: Settings > Secrets and variables > Actions > New repository secret
          # Create a secret named NPM_TOKEN with your NPM automation token
          # Generate token at: https://www.npmjs.com/settings/[username]/tokens
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Report job status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Successfully published packages to NPM"
          else
            echo "❌ Failed to publish packages to NPM"
            exit 1
          fi
