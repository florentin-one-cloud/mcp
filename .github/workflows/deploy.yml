name: Deploy MCP Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all
        run: pnpm run build-all
      - name: Type check
        run: pnpm run check
      - name: Test all
        run: pnpm run test:all

  discover:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.discover.outputs.workers }}
    steps:
      - uses: actions/checkout@v6
      - id: discover
        run: |
          WORKERS=$(ls -d src/*/package.json | while read f; do
            if grep -q '"name": *"@florentin-one/mcp-' "$f" 2>/dev/null; then
              basename "$(dirname "$f")"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"

  deploy-services:
    needs: [build, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        worker: ${{ fromJson(needs.discover.outputs.workers) }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all
        run: pnpm run build-all
      - name: Deploy ${{ matrix.worker }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: src/${{ matrix.worker }}
