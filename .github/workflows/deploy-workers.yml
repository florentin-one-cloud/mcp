name: Deploy to Cloudflare Workers

# Trigger deployment on push to main branch (only when source files change)
# or manually via workflow_dispatch
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

# Required permissions for deployment
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy MCP Servers
    runs-on: ubuntu-latest
    strategy:
      # Deploy servers in parallel for faster deployment
      matrix:
        server:
          - metacognitive-monitoring
          - sequential-thinking
          - structured-argumentation
          - scientific-method
          - collaborative-reasoning
          - constraint-solver
          - narrative-planner
      # Continue deploying other servers even if one fails
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build-all

      # Deploy to Cloudflare Workers using wrangler
      # Required secrets:
      # - CLOUDFLARE_API_TOKEN: API token from Cloudflare dashboard
      #   To obtain: Go to https://dash.cloudflare.com/profile/api-tokens
      #   Click "Create Token" -> Use "Edit Cloudflare Workers" template
      #   Or create custom token with "Account.Workers Scripts" permissions
      # - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
      #   To obtain: Go to https://dash.cloudflare.com/ -> Select any domain
      #   Account ID is visible in the right sidebar under "Account ID"
      - name: Deploy ${{ matrix.server }} to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: src/${{ matrix.server }}

      - name: Report deployment status
        if: success()
        run: |
          echo "✅ Successfully deployed ${{ matrix.server }} to Cloudflare Workers"
          echo "Server: ${{ matrix.server }}"
          echo "Status: Deployed"
          echo "Environment: Production"

      - name: Report deployment failure
        if: failure()
        run: |
          echo "❌ Failed to deploy ${{ matrix.server }} to Cloudflare Workers"
          echo "Server: ${{ matrix.server }}"
          echo "Status: Failed"
          echo "Please check the logs above for details"
