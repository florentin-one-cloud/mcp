name: Publish to NPM

# Trigger on version tags (e.g., v1.0.0, v2.1.3)
on:
  push:
    tags:
      - "v*.*.*"

# Configure permissions for the workflow
# id-token: write is required for NPM Trusted Publishing via OIDC
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Build all packages
        run: npm run build-all

      - name: Publish packages to NPM
        run: npm run publish-packages
        # Using NPM Trusted Publishing (OIDC)
        # No NPM_TOKEN needed - authentication via GitHub OIDC token
        # Requires configuring trusted publisher at: https://www.npmjs.com/settings/[org]/publishing
        # Add this repository as a trusted publisher for @florentin-one scope

      - name: Report job status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Successfully published packages to NPM"
          else
            echo "❌ Failed to publish packages to NPM"
            exit 1
          fi
